<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testar HTML - GP Streaming</title>
<link rel="icon" href="https://tools.gpstreaming.com.br/img/favicon_invertido.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="https://tools.gpstreaming.com.br/img/favicon.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="https://tools.gpstreaming.com.br/img/apple.png">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mut:#667085;--bd:#dfe3ea;--pri:#ff0000}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e8ebf0;--mut:#98a2b3;--bd:#2c3340;--pri:#ff0000}}
*{box-sizing:border-box}
body{margin:0;font:20px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
.logo{display:block;max-width:200px;max-height:90px;height:auto;margin:0 auto 12px}
.logolink{display:block;width:fit-content;margin:0 auto}
h1{font-size:1.6rem;margin:8px 0 20px;text-align:center}

.panel{background:var(--card);border:3px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.panel:focus-within{border-color:var(--pri)}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.head h2{font-size:1rem;margin:0}
.hint{font-size:.8rem;color:var(--mut);margin:0}

textarea{display:block;width:100%;height:340px;resize:vertical;
  font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2;
  background:var(--bg);color:var(--tx);border:3px solid var(--bd);border-radius:10px;padding:12px;outline:none;white-space:pre-wrap;overflow-wrap:anywhere}
textarea:focus{border-color:var(--pri)}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
button{font:inherit;font-size:1rem;cursor:pointer;padding:10px 18px;border-radius:14px;
  background:var(--card);color:var(--tx);border:3px solid var(--bd);transition:border-color .15s,transform .15s}
button:hover,button:focus-visible{border-color:var(--pri);transform:translateY(-2px);outline:none}
button:active{transform:translateY(0)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}

iframe{display:block;width:100%;height:100vh;min-height:600px;border:3px solid var(--bd);border-radius:10px;background:#fff}
.back{display:block;width:fit-content;margin:24px auto 0;padding:12px 24px;border-radius:14px;background:var(--pri);border:3px solid var(--pri);color:#fff;font-size:1rem;font-weight:600;text-decoration:none;transition:transform .15s,filter .15s}
.back:hover,.back:focus-visible{filter:brightness(1.1);transform:translateY(-2px);outline:none}
.back:active{transform:translateY(0)}
@media(max-width:600px){textarea{height:260px}iframe{min-height:560px}button{flex:1 1 calc(50% - 5px)}}
</style>
</head>
<body>
<main>
<a class="logolink" href="https://tools.gpstreaming.com.br">
<picture>
  <source srcset="https://tools.gpstreaming.com.br/img/logo.png" media="(prefers-color-scheme: dark)">
  <img class="logo" src="https://tools.gpstreaming.com.br/img/logo_invertido.png" alt="Logo">
</picture>
</a>
<h1>Testar HTML</h1>

<section class="panel">
  <div class="head">
    <h2>Seu código</h2>
    <p class="hint">Ctrl + Enter para executar</p>
  </div>
  <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Código HTML"></textarea>
  <div class="actions">
    <button class="pri" id="run" type="button">Executar</button>
	<button id="copy" type="button">Copiar</button>
	<button id="sel" type="button">Selecionar tudo</button>
	<button id="paste" type="button">Colar</button>
    <button id="model" type="button">Modelo</button>
    <button id="clear" type="button">Limpar</button>
  </div>
</section>

<section class="panel">
  <div class="head">
    <h2>Resultado</h2>
    <div class="actions" style="margin:0"><button id="full" type="button">Tela cheia</button>
    <button id="tab" type="button">Nova guia</button></div>
  </div>
  <p class="hint" id="status" style="margin:0 0 10px">Aguardando execução</p>
  <iframe id="out" title="Resultado" allowfullscreen sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
</section>

<a class="back" href="https://tools.gpstreaming.com.br">Voltar para Tools</a>
</main>

<script>
(function(){
  var code = document.getElementById('code');
  var out = document.getElementById('out');
  var status = document.getElementById('status');
  var KEY = 'gp_testar_html';
  var MODEL = '<!DOCTYPE html>\n<html>\n<body>\n  Página HTML\n  <script>\n    /* escreva seu código aqui */\n  <\/script>\n</body>\n</html>';

  function save(){ try{ localStorage.setItem(KEY, code.value); }catch(e){} }
  function load(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }

  function run(){
    out.srcdoc = code.value;
    status.textContent = 'Executado às ' + new Date().toLocaleTimeString('pt-BR');
    save();
  }

  code.value = load() || MODEL;

  document.getElementById('run').onclick = run;
  document.getElementById('model').onclick = function(){ code.value = MODEL; run(); };
  document.getElementById('clear').onclick = function(){ code.value = ''; out.srcdoc = ''; status.textContent = 'Aguardando execução'; save(); code.focus(); };
  document.getElementById('copy').onclick = function(){
    var b = this;
    function ok(){ b.textContent = 'Copiado'; setTimeout(function(){ b.textContent = 'Copiar'; }, 1500); }
    if(navigator.clipboard){ navigator.clipboard.writeText(code.value).then(ok); }
    else { code.select(); document.execCommand('copy'); ok(); }
  };

  document.getElementById('full').onclick = function(){ if(out.requestFullscreen){ out.requestFullscreen(); } };

  document.getElementById('sel').onclick = function(){ code.focus(); code.select(); };
  document.getElementById('paste').onclick = function(){
    var b = this;
    function done(t){ b.textContent = t; setTimeout(function(){ b.textContent = 'Colar'; }, 1800); }
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(t){
        var s = code.selectionStart, n = code.selectionEnd;
        code.value = code.value.slice(0, s) + t + code.value.slice(n);
        code.selectionStart = code.selectionEnd = s + t.length;
        code.focus(); save();
      }).catch(function(){ code.focus(); done('Use Ctrl+V'); });
    } else { code.focus(); done('Use Ctrl+V'); }
  };
  document.getElementById('tab').onclick = function(){
    var data = JSON.stringify(code.value).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
    var page = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Resultado HTML - GP Streaming</title>' +
      '<style>html,body{margin:0;height:100%}iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style></head><body>' +
      '<iframe id="f" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>' +
      '<script>document.getElementById("f").srcdoc = ' + data + ';<\/script></body></html>';
    var url = URL.createObjectURL(new Blob([page], {type:'text/html'}));
    var w = window.open(url, '_blank');
    if(!w){ alert('O navegador bloqueou a nova guia. Permita pop-ups para este site.'); }
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  };

  code.addEventListener('input', save);
  code.addEventListener('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); run(); return; }
    if(e.key === 'Tab'){
      e.preventDefault();
      var s = code.selectionStart, n = code.selectionEnd;
      code.value = code.value.slice(0, s) + '  ' + code.value.slice(n);
      code.selectionStart = code.selectionEnd = s + 2;
    }
  });

  run();
})();
</script>
</body>
</html>
